version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: swagdoc
    main: ./cmd/swagdoc
    binary: swagdoc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: parnexcodes
    name: swag-doc
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## What's Changed

  footer: |
    **Full Changelog**: https://github.com/parnexcodes/swag-doc/compare/{{ .PreviousTag }}...{{ .Tag }}
